# luban:foot's defaults; ~/.config/foot/foot.ini replaces them.
[main]
font=monospace:size=11
pad=6x4

# The right button pastes the clipboard, as on other desktops (xlings design
# 2026-10-24 §8.3); the middle button pastes what is selected (foot's own);
# Ctrl with the right button extends a selection (Shift is foot's override
# of a program's mouse).
[mouse-bindings]
clipboard-paste=BTN_RIGHT
select-extend=Control+BTN_RIGHT
select-extend-character-wise=Control+Shift+BTN_RIGHT
