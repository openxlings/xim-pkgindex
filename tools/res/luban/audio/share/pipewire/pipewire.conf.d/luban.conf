# The `luban` sink (xlings design 2026-10-20 §20.1): what is played goes, as
# 48 kHz stereo signed 16-bit samples, into a named pipe that `luban __audio`
# reads and the Luban OS window plays on the computer it runs on. The
# default output: its priority is above any other's.
context.modules = [
    { name = libpipewire-module-pipe-tunnel
      args = {
          tunnel.mode = sink
          pipe.filename = "/tmp/luban-audio.pcm"
          audio.format = S16LE
          audio.rate = 48000
          audio.channels = 2
          audio.position = [ FL FR ]
          stream.props = {
              node.name = luban
              node.description = "This computer (Luban OS)"
              priority.session = 2000
              priority.driver = 2000
          }
      }
    }
]
