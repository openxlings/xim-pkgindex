<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- A Luban desktop component's fonts: the system's and the user's; a cache per user;
     Qt's and LXQt's "Sans" is the sans-serif here. -->
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <dir prefix="xdg">fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <alias><family>sans-serif</family><prefer><family>Inter</family><family>Noto Sans SC</family><family>DejaVu Sans</family></prefer></alias>
  <alias><family>Sans</family><prefer><family>Inter</family><family>Noto Sans SC</family><family>DejaVu Sans</family></prefer></alias>
  <alias><family>Sans Serif</family><prefer><family>Inter</family><family>Noto Sans SC</family><family>DejaVu Sans</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>JetBrains Mono</family><family>Sarasa Mono SC</family><family>DejaVu Sans Mono</family></prefer></alias>
</fontconfig>
