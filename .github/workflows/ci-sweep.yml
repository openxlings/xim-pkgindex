# Periodic lifecycle sweep — the net under `ci-test.yml`.
#
# WHY THIS EXISTS
#
# ci-test.yml installs only what a push CHANGED. That is the right default:
# 260 recipes on three platforms is not a per-push budget. But it means a
# recipe's install hook is exercised exactly when someone edits it, and never
# otherwise — so a hook can be wrong for years and nothing says so.
#
# That is not a hypothetical. `xim:wix`'s install hook had NEVER run in CI:
# `tests/w/test_wix.py` is static-only, and until `huxerui.huxerui` arrived no
# package in either index depended on it. Its extractor reached for the host's
# `tar`, which is unreachable in the environment xlings runs hooks in, and the
# first consumer to pull wix in found that out — on someone else's PR, three
# repositories away from the recipe at fault (openxlings/xim-pkgindex#809).
#
# A sweep turns "whoever depends on it first" into "the calendar".
#
# ROTATION, NOT FULL COVERAGE PER RUN
#
# A weekly full sweep would be ~260 installs per platform. Instead each run
# takes one slice of SLICES, chosen by ISO week, so every recipe is exercised
# once per SLICES weeks at a bounded cost per run. The slice is a function of
# the file list and the week alone — no state, and re-running a week reproduces
# the same set.
#
# `workflow_dispatch` takes an explicit slice, which is how you re-run the one
# that failed without waiting for the calendar to come round again, or `all`:
# every slice on every leg at once (with `slices` to size the jobs) -- the
# whole index under a client under test (`xlings_sha`), as a client release
# that changes what installs do is checked (xlings design 2026-11-27, P4).
#
# LEGS. Linux x86_64 and aarch64, macOS (arm64) and Windows. On aarch64 a
# recipe whose entry does not list it is refused before the download
# (E_UNSUPPORTED_TARGET): counted as unsupported, not as a failure -- the
# index's coverage table is where that is tracked. Each leg uploads the
# findings the client recorded (<home>/logs/findings.ndjson): rule P,
# hook-call-failed and the rest, per recipe, over the whole slice.
name: ci-sweep

on:
  workflow_call:
    inputs:
      xlings_sha:
        type: string
        default: ''
      base_sha:
        type: string
        default: ''
      head_sha:
        type: string
        default: ''
  schedule:
  - cron: 0 4 * * 1
  workflow_dispatch:
    inputs:
      xlings_sha:
        description: 'an openxlings/xlings commit whose CI build is the client under test (setup-xlings); default: the pinned release'
        type: string
        default: ''
      slice:
        description: 'Slice index to run (blank = pick from the ISO week; all = every slice)'
        required: false
        default: ''
      slices:
        description: 'How many slices the index is cut into'
        required: false
        default: '4'

concurrency:
  group: sweep-${{ github.event.pull_request.number || github.ref }}-${{ inputs.xlings_sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        shell: bash
        env:
          VALIDATION: ${{ inputs.base_sha != '' || github.event_name == 'pull_request' }}
          SLICE: ${{ inputs.slice }}
          SLICES: ${{ inputs.slices || '4' }}
        run: |
          set -euo pipefail
          legs='[{"leg":"linux","os":"ubuntu-latest","platform":"linux"},
                 {"leg":"linux-aarch64","os":"ubuntu-24.04-arm","platform":"linux"},
                 {"leg":"macosx","os":"macos-latest","platform":"macosx"},
                 {"leg":"windows","os":"windows-latest","platform":"windows"}]'
          if [ "$VALIDATION" = true ]; then
            slices='["validation"]'
          elif [ "$SLICE" = all ]; then
            slices=$(python3 -c "import json,sys; print(json.dumps([str(i) for i in range(int(sys.argv[1]))]))" "$SLICES")
          elif [ -n "$SLICE" ]; then
            slices="[\"$SLICE\"]"
          else
            slices="[\"$(( $(date -u +%V) % SLICES ))\"]"
          fi
          matrix=$(python3 -c "import json,sys; print(json.dumps({'include': [dict(l, slice=s, slices=sys.argv[3]) for l in json.loads(sys.argv[1]) for s in json.loads(sys.argv[2])]}))" "$legs" "$slices" "$SLICES")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  sweep:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 340
    name: sweep ${{ matrix.leg }} (slice ${{ matrix.slice }}/${{ matrix.slices }})
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: ./.github/actions/setup-xlings
        with:
          xlings_sha: ${{ inputs.xlings_sha }}
      - name: The slice's recipes
        id: files
        shell: bash
        env:
          SLICE: ${{ matrix.slice }}
          SLICES: ${{ matrix.slices }}
        run: |
          set -euo pipefail
          if [ "$SLICE" = validation ]; then
            echo 'files=pkgs/e/eden.lua pkgs/e/eden-android.lua' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Sorted so the partition is stable: the same recipe lands in the
          # same slice until the file list itself changes.
          mapfile -t all < <(git ls-files 'pkgs/*/*.lua' | sort)
          sel=()
          for i in "${!all[@]}"; do
            [ $(( i % SLICES )) -eq "$SLICE" ] && sel+=("${all[$i]}")
          done
          echo "slice $SLICE of $SLICES -- ${#sel[@]} of ${#all[@]} recipes"
          echo "files=${sel[*]}" >> "$GITHUB_OUTPUT"
          # The index under test is this checkout: every recipe of it is placed
          # in the index before the slice installs, so a dependency resolves as
          # this tree has it -- another slice's recipe included -- and not as
          # the published index has it. Measured 2026-11-27: a branch that gave
          # mesa's closure aarch64 builds was swept with the published,
          # x86_64-only dependencies, and rule M refused them.
          echo "overlay=${all[*]}" >> "$GITHUB_OUTPUT"
      - name: ELF + Lua tooling for the closure check
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils patchelf lua5.4
      - name: Install/uninstall sweep (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        env:
          FILES: ${{ steps.files.outputs.files }}
          OVERLAY: ${{ steps.files.outputs.overlay || steps.files.outputs.files }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          chmod +x .github/scripts/posix-test.sh .github/scripts/dep-closure-check.sh
          .github/scripts/posix-test.sh "$FILES" "$GITHUB_WORKSPACE" "$PLATFORM" "$OVERLAY"
      - name: Install/uninstall sweep (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          FILES: ${{ steps.files.outputs.files }}
          OVERLAY: ${{ steps.files.outputs.overlay || steps.files.outputs.files }}
        run: |
          pwsh -NoProfile -File .github/scripts/windows-test.ps1 `
            -ChangedFiles $env:FILES `
            -WorkspaceRoot "${{ github.workspace }}" `
            -OverlayFiles $env:OVERLAY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # What the client recorded while installing the slice: the list P4 and
      # P11 read (rule P, hook-call-failed, closure findings), per recipe.
      - name: The client's findings
        if: always()
        shell: bash
        run: |
          f="${XLINGS_HOME:-$HOME/.xlings}/logs/findings.ndjson"
          mkdir -p sweep-findings
          if [ -f "$f" ]; then
            cp "$f" sweep-findings/findings.ndjson
            python3 - "$f" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import collections, json, sys
          counts = collections.Counter()
          for line in open(sys.argv[1], encoding="utf-8"):
              try:
                  counts[json.loads(line).get("code", "?")] += 1
              except ValueError:
                  counts["(unreadable line)"] += 1
          print("| finding | count |\n|---|---:|")
          for code, n in counts.most_common():
              print(f"| `{code}` | {n} |")
          PY
          else
            echo "no findings recorded" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sweep-findings-${{ matrix.leg }}-${{ matrix.slice }}
          path: sweep-findings/
          if-no-files-found: ignore
