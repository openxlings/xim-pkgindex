# Toolchain-bump consumer smoke — the gate the llvm 22.1.8 incident showed
# was missing (2026-07-08: the default-llvm bump broke every macOS mcpp
# build via a libc++ header/dylib split; nothing in this repo's CI builds
# WITH a bumped toolchain, so it merged green and detonated downstream).
#
# For PRs touching a toolchain package, install the bumped toolchain FROM
# THIS PR's tree, then act as the toolchain's real consumer: mcpp (stable
# release) builds and tests a program that exercises std string hashing —
# the exact class of symbol that crosses the libc++ dylib boundary.
#
# Design: mcpp .agents/docs/2026-07-08-root-cause-remediation-design.md §C.1.

name: toolchain consumer smoke

on:
  workflow_call:
    inputs:
      files:
        type: string
        default: ""
      base_sha:
        type: string
        default: ""
      head_sha:
        type: string
        default: ""

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          FILES: ${{ inputs.files }}
        run: python3 .github/scripts/ci-toolchain-plan.py --files "$FILES" --github-output "$GITHUB_OUTPUT"
  consumer-smoke:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix).include }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install xlings
        run: |
          export XLINGS_NON_INTERACTIVE=1
          curl -fsSL https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh | bash
          echo "$HOME/.xlings/bin"               >> "$GITHUB_PATH"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"

      - name: Detect changed toolchain descriptors
        uses: tj-actions/changed-files@v46
        id: changed
        with:
          files: |
            pkgs/l/llvm.lua
            pkgs/g/gcc.lua
            pkgs/m/musl-gcc.lua

      - name: Register the changed descriptor via add-xpkg
        run: |
          # `xlings --add-xpkg <file>` is the sanctioned single-descriptor
          # local-index mechanism (validated copy into xim-pkgindex-local);
          # `local:<pkg>` install then targets it unambiguously — a bare
          # name is ambiguous once the descriptor exists in two indexes.
          xlings config --index-repo "scode:https://github.com/openxlings/xim-pkgindex-scode.git" 2>/dev/null || true
          CHANGED="${{ inputs.files || steps.changed.outputs.all_changed_files }}"
          echo "changed: $CHANGED"
          for f in $CHANGED; do
            case "$f" in pkgs/l/llvm.lua|pkgs/g/gcc.lua|pkgs/m/musl-gcc.lua) xlings config --add-xpkg "$f" ;; esac
          done
          # AND THE SHARED MODULES THE DESCRIPTOR IMPORTS. Without them a
          # `local:` recipe's `import("xim.pkgindex.*")` resolves to the proxy
          # that swallows every call (ci-xpkg-test.yml says the same of
          # selfcontain.seal): gcc's specs rewrite through `shell.exec` then
          # did nothing, and the install failed on its own verification.
          LOCAL_IDX="$HOME/.xlings/data/xim-pkgindex-local"
          mkdir -p "$LOCAL_IDX/libs"
          cp -f libs/*.lua "$LOCAL_IDX/libs/"
          echo "CHANGED_FILES=$CHANGED" >> "$GITHUB_ENV"

      - name: Install the bumped toolchain + mcpp
        run: |
          # Derive the tool from the changed FILE NAME (musl-gcc.lua also
          # matches *gcc.lua* — order matters; round 4 installed local:gcc
          # for a musl-gcc bump and died on 'not found').
          TOOL="${{ matrix.tool }}"
          RECIPE="${{ matrix.recipe }}"
          SOURCE=xim
          if [[ " $CHANGED_FILES " == *" $RECIPE "* ]]; then SOURCE=local; fi
          xlings install "$SOURCE:$TOOL" -y
          echo "TOOL_SOURCE=$SOURCE" >> "$GITHUB_ENV"
          xlings install mcpp -y
          MCPP="$HOME/.xlings/subos/default/bin/mcpp"
          test -x "$MCPP"
          "$MCPP" --version
          echo "MCPP=$MCPP" >> "$GITHUB_ENV"
          echo "MCPP_VENDORED_XLINGS=$HOME/.xlings/subos/default/bin/xlings" >> "$GITHUB_ENV"

      - name: Point mcpp at the xlings-installed toolchain
        run: |
          # Mirror mcpp ci-macos's sandbox-reuse dance, version-agnostic:
          # symlink whatever the PR installed into mcpp's registry and make
          # it the default toolchain.
          set -e
          mkdir -p "$HOME/.mcpp/registry/data/xpkgs"
          # The compiler's complete installed closure is part of this fixture.
          # Reusing only LLVM hides sibling UAPI headers from mcpp's probes.
          for provider in "$HOME/.xlings/data/xpkgs/"*; do
            [ -d "$provider" ] || continue
            name=$(basename "$provider")
            mkdir -p "$HOME/.mcpp/registry/data/xpkgs/$name"
            for payload in "$provider"/*/; do
              [ -d "$payload" ] || continue
              version=$(basename "$payload")
              ln -sfn "$payload" "$HOME/.mcpp/registry/data/xpkgs/$name/$version"
            done
          done
          tool="${{ matrix.tool }}"
          kind="xim-x-$tool"
          src_root="$HOME/.xlings/data/xpkgs/$TOOL_SOURCE-x-$tool"
          test -d "$src_root"
          for verdir in "$src_root"/*/; do
            ver=$(basename "$verdir")
            printf '1\n' > "$verdir/.mcpp_ok"
            mkdir -p "$HOME/.mcpp/registry/data/xpkgs/$kind"
            ln -sfn "$verdir" "$HOME/.mcpp/registry/data/xpkgs/$kind/$ver"
            case "$tool" in
              llvm) echo "TOOLCHAIN=llvm@$ver" >> "$GITHUB_ENV" ;;
              gcc) echo "TOOLCHAIN=gcc@$ver" >> "$GITHUB_ENV" ;;
              musl-gcc) echo "TOOLCHAIN=gcc@$ver-musl" >> "$GITHUB_ENV" ;;
            esac
          done

      - name: Consumer smoke — mcpp builds + tests with the bumped toolchain
        run: |
          set -e
          "$MCPP" new smokeapp
          cd smokeapp
          "$MCPP" toolchain default "$TOOLCHAIN" || true
          mkdir -p tests
          cat > tests/hash_test.cpp <<'EOF'
          // std string hashing — the symbol class that crosses the libc++
          // dylib boundary (llvm 22.1.8's __hash_memory).
          import std;

          int main() {
              std::unordered_map<std::string, int> m;
              for (int i = 0; i < 100; ++i) m["key" + std::to_string(i)] = i;
              return (m.size() == 100 && m.at("key42") == 42) ? 0 : 1;
          }
          EOF
          "$MCPP" build
          "$MCPP" run
          "$MCPP" test
