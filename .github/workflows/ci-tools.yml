name: tools test

# The publishing scripts had NO coverage in this repo: every workflow filters on
# `pkgs/**`, so a change under tools/ triggered nothing at all. Those scripts are
# what writes the index pointer every client reads -- breaking one is silent
# until a publish goes out wrong.
on:
  workflow_call:
    inputs:
      base_sha:
        type: string
        default: ""
      head_sha:
        type: string
        default: ""
  workflow_dispatch: null

jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Lint workflow and action expressions
        env:
          TOOLROOT: ${{ runner.temp }}/actionlint
        run: |
          mkdir -p "$TOOLROOT"
          curl -fsSL --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$TOOLROOT/actionlint.tar.gz"
          printf '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  %s\n' "$TOOLROOT/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$TOOLROOT/actionlint.tar.gz" -C "$TOOLROOT" actionlint
          # Keep expression/type validation identical on developer hosts and runners.
          # Shell policy checks below have their own explicit scope.
          "$TOOLROOT/actionlint" -color -shellcheck= -pyflakes=

      - name: CI architecture regression tests
        run: |
          python3 -m pip install pytest pyyaml # host-dep-ok: CI test harness
          python3 -m pytest tests/test_ci_architecture.py tests/test_autoupdate_dispatch.py tests/test_autoupdate_state.py tests/test_autoupdate_workflow.py -q

      - name: Shell scripts parse
        run: |
          for f in tools/*.sh; do bash -n "$f" || exit 1; done
          echo "all tools/*.sh parse"

      # What CI takes from a runner is the T0 list; the rest comes from xlings.
      - name: Host dependencies (tools/lint_host_deps.sh)
        run: bash tools/lint_host_deps.sh

      # A value a recipe hands to a shell is quoted (mcpp#832).
      - name: Exec quoting (tools/lint_exec_quoting.sh)
        run: bash tools/lint_exec_quoting.sh

      - name: Pointer history retention policy
        run: python3 tests/scripts/test_index_pointer_history.py

      # Builds a real artifact from THIS tree and checks the manifest shape,
      # which is the step that carries the client contract.
      - name: Build an index artifact from this tree
        run: |
          bash tools/build_xim_index_artifact.sh --version citest --out build/index --src .
          python3 - <<'PY'
          import json, pathlib, sys
          m = json.load(open("build/index/xim-index-citest.manifest.json"))
          for key in ("index_version", "artifact", "requires"):
              if key not in m:
                  sys.exit(f"manifest is missing {key}: {sorted(m)}")
          if not m["artifact"].get("sha256"):
              sys.exit("manifest artifact carries no sha256")
          print(f"manifest ok: requires={m['requires']}")
          PY

      # Reports what floor this tree would need. Informational on purpose: the
      # floor must not be declared until the pointer has history to route back
      # to, so failing here would push a maintainer into doing it too early.
      - name: Report the client floor this tree implies
        run: python3 tools/check_index_compat.py . || true
