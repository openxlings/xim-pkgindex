# https://github.com/mqyqingfeng/Blog/issues/236

name: gitee-sync
# On every push to main; by hand and once a day too: a push GitHub did not
# deliver (2026-10-22) left the CN mirror a release behind (xlings design
# 2026-10-23 J46).
on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * *'
concurrency:
  group: gitee-main
  cancel-in-progress: false
jobs:
  repo-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Mirror the Github organization repos to Gitee.
        uses: Yikun/hub-mirror-action@master
        with:
          src: 'github/openxlings'
          dst: 'gitee/Sunrisepeak'
          dst_key: ${{ secrets.GITEE_SSH_KEY }}
          dst_token:  ${{ secrets.GITEE_TOKEN }}
          static_list: "xim-pkgindex"
          force_update: true
          debug: true
