name: Luban Agent private acceptance

on:
  pull_request:
    paths:
      - 'pkgs/l/luban-tiny.lua'
      - 'pkgs/l/luban-core.lua'
      - 'pkgs/a/agent-private.lua'
      - 'pkgs/a/agent-workspace-private.lua'
      - 'scripts/test-luban-agent-private.py'
      - 'tests/fixtures/luban_network_probe.cpp'
      - '.github/workflows/luban-agent-private.yml'
  workflow_dispatch:

jobs:
  rootfs-private-offline:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install published xlings
        run: |
          export XLINGS_NON_INTERACTIVE=1
          curl -fsSL https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh | bash
          echo "$HOME/.xlings/bin" >> "$GITHUB_PATH"
      - name: Real rootfs, owner policy, C++23 build, network and offline closure
        run: python3 scripts/test-luban-agent-private.py --home "$RUNNER_TEMP/luban-agent-acceptance"
      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luban-agent-acceptance
          path: |
            ${{ runner.temp }}/luban-agent-acceptance/acceptance.log
            ${{ runner.temp }}/luban-agent-acceptance/logs/hooks/*.log
