name: xpkgindex-update
on:
  schedule:
    - cron: '17 2 * * *' # Daily cadence gate; actual updates every 3 UTC days from 2026-10-23
  workflow_dispatch:
    inputs:
      package:
        description: 'Optional namespace:name'
        type: string
        required: false
      validation_base:
        description: 'Candidate CI only: compare against this ref and never propose'
        type: string
        required: false
  pull_request:
    paths: ['pkgs/**', 'tests/**', '.github/xpkgindex-update.yml', '.github/scripts/autoupdate-ci.py', '.github/scripts/autoupdate-dispatch.py', 'tools/autoupdate_policy.py', '.github/workflows/xpkgindex-update.yml']
permissions:
  contents: read
concurrency:
  group: unified-updater-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  PYTHONUTF8: '1'
  UPDATER_COMMIT: 516e15d5f797803743486a7c0ef6e9ccbd2f5978
  XLINGS_VERSION: v2026.10.21.4
jobs:
  cadence:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.cadence.outputs.due }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce a three-day update interval across month boundaries
        id: cadence
        env:
          EVENT: ${{ github.event_name }}
        run: python3 tools/autoupdate_policy.py --event "$EVENT" --github-output "$GITHUB_OUTPUT"
  scan:
    needs: cadence
    if: needs.cadence.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
      checked: ${{ steps.check.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: openxlings/xpkgindex-update
          ref: ${{ env.UPDATER_COMMIT }}
          path: .updater
          persist-credentials: false
      - name: Use the pinned updater source
        run: echo "PYTHONPATH=$PWD/.updater/src" >> "$GITHUB_ENV"
      - name: Test audit generation and admission rules
        run: |
          python -m pip install pytest # host-dep-ok: the runner test harness
          python -m pytest -q tests/test_autoupdate_audit.py
      - name: Audit all package declarations
        run: python .github/scripts/autoupdate-ci.py audit --output coverage.json
      - name: Protect published versions
        if: inputs.validation_base != '' || (github.event_name == 'pull_request' && (github.event.pull_request.user.login == 'github-actions[bot]' || github.head_ref == 'feat/unified-autoupdate'))
        env:
          BASE: ${{ github.event.pull_request.base.sha || inputs.validation_base }}
        run: |
          resolved=$(git rev-parse --verify "$BASE^{commit}" 2>/dev/null || git rev-parse --verify "origin/$BASE^{commit}")
          python -m xpkgindex_update guard --base "$resolved" --output preservation.json
      - uses: actions/cache/restore@v4
        if: github.event_name != 'pull_request' && inputs.validation_base == ''
        with:
          path: .update-state.json
          key: unified-update-state-${{ github.run_id }}
          restore-keys: unified-update-state-
      - name: Check real upstream resources once
        id: check
        if: github.event_name != 'pull_request' && inputs.validation_base == ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ inputs.package }}
        run: |
          args=()
          if [[ -n "$PACKAGE" ]]; then args+=(--package "$PACKAGE"); fi
          python -m xpkgindex_update check "${args[@]}" --state-file .update-state.json --output plan.json
      - uses: actions/cache/save@v4
        if: always() && github.event_name != 'pull_request' && inputs.validation_base == ''
        with:
          path: .update-state.json
          key: unified-update-state-${{ github.run_id }}
      - name: Select added candidate versions from the PR diff
        id: matrix
        env:
          BASE: ${{ github.event.pull_request.base.sha || inputs.validation_base || github.sha }}
        run: |
          resolved=$(git rev-parse --verify "$BASE^{commit}" 2>/dev/null || git rev-parse --verify "origin/$BASE^{commit}")
          python .github/scripts/autoupdate-ci.py matrix --base "$resolved" --output matrix.json
          echo "value=$(python -c 'import json; print(json.dumps(json.load(open("matrix.json")),separators=(",",":")))')" >> "$GITHUB_OUTPUT"
      - name: Verify every added candidate resource without discovery
        if: steps.matrix.outputs.value != '{"include":[]}'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha || inputs.validation_base || github.sha }}
        run: |
          resolved=$(git rev-parse --verify "$BASE^{commit}" 2>/dev/null || git rev-parse --verify "origin/$BASE^{commit}")
          python -m xpkgindex_update verify --base "$resolved" --output candidate-resources.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-update-plan
          path: |
            plan.json
            coverage.json
            matrix.json
            preservation.json
            candidate-resources.json
  propose:
    needs: scan
    if: >-
      always() && needs.scan.result == 'success' && github.event_name != 'pull_request' && inputs.validation_base == '' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: openxlings/xpkgindex-update
          ref: ${{ env.UPDATER_COMMIT }}
          path: .updater
          persist-credentials: false
      - run: echo "PYTHONPATH=$PWD/.updater/src" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: unified-update-plan
          path: .update-plan
      - name: Propose from the fixed plan
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.ref_name }}
        run: |
          git switch -C "$BASE" "$GITHUB_SHA"
          python -m xpkgindex_update propose --plan .update-plan/plan.json --base "$BASE" --draft --output proposals.json
          python .github/scripts/autoupdate-dispatch.py --proposals proposals.json --base "$BASE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-update-proposals
          path: |
            proposals.json
            dispatches.json
  candidate:
    needs: scan
    if: needs.scan.outputs.matrix != '' && needs.scan.outputs.matrix != '{"include":[]}'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.scan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: openxlings/xpkgindex-update
          ref: ${{ env.UPDATER_COMMIT }}
          path: .updater
          persist-credentials: false
      - name: Use the pinned updater and CI test harness
        shell: bash
        run: |
          echo "PYTHONPATH=$(python -c 'from pathlib import Path; print(Path(".updater/src").resolve())')" >> "$GITHUB_ENV"
          python -m pip install pytest # host-dep-ok: the runner test harness, not a package runtime dependency
      - name: Install xlings on POSIX
        if: runner.os != 'Windows'
        shell: bash
        env:
          XLINGS_NON_INTERACTIVE: '1'
        run: |
          curl -fsSL https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh | bash
          echo "$HOME/.xlings/bin" >> "$GITHUB_PATH"
          echo "$HOME/.xlings/subos/default/bin" >> "$GITHUB_PATH"
      - name: Install xlings on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          XLINGS_NON_INTERACTIVE: '1'
        run: |
          iex (Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.ps1' -UseBasicParsing).Content
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.xlings\bin"
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.xlings\subos\default\bin"
      - name: Install, verify and remove the exact candidate
        env:
          PACKAGE: ${{ matrix.id }}
          RECIPE: ${{ matrix.path }}
          VERSION: ${{ matrix.version }}
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: python .github/scripts/autoupdate-ci.py candidate --package "$PACKAGE" --path "$RECIPE" --version "$VERSION" --arch "$ARCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-${{ strategy.job-index }}
          path: candidate-evidence.json
  result:
    needs: [cadence, scan, propose, candidate]
    if: always() && needs.cadence.outputs.due == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Reject incomplete verification
        env:
          SCAN: ${{ needs.scan.result }}
          CHECK: ${{ needs.scan.outputs.checked }}
          PROPOSE: ${{ needs.propose.result }}
          CANDIDATE: ${{ needs.candidate.result }}
        run: |
          [[ "$SCAN" == success ]]
          [[ "$CHECK" != failure ]]
          [[ "$PROPOSE" != failure && "$PROPOSE" != cancelled ]]
          [[ "$CANDIDATE" != failure && "$CANDIDATE" != cancelled ]]
