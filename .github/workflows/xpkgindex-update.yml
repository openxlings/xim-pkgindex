name: xpkgindex-update
on:
  schedule:
    - cron: '17 2 * * *' # Daily cadence gate; actual updates every 3 UTC days from 2026-10-23
  workflow_dispatch:
    inputs:
      package:
        description: 'Optional namespace:name'
        type: string
        required: false
      max_batches:
        description: 'Sequential scan batches (50 packages each, shared network budgets; 1..20)'
        type: number
        default: 20
      dry_run:
        description: 'Scan upstream and upload the plan without creating PRs or dispatching CI'
        type: boolean
        default: false
      validation_base:
        description: 'Candidate CI only: compare against this ref and never propose'
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: unified-updater-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  PYTHONUTF8: '1'
  UPDATER_COMMIT: ffda5ad4cdaae5c4fec6e76ab1d498220cf79a69
  XLINGS_VERSION: v2026.10.24.3
jobs:
  cadence:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.cadence.outputs.due }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce a three-day update interval across month boundaries
        id: cadence
        env:
          EVENT: ${{ github.event_name }}
        run: python3 tools/autoupdate_policy.py --event "$EVENT" --github-output "$GITHUB_OUTPUT"
  scan:
    needs: cadence
    if: needs.cadence.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
      checked: ${{ steps.check.outcome }}
      state_ready: ${{ steps.progress.outputs.ready }}
      plan_ready: ${{ steps.progress.outputs.plan_ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: openxlings/xpkgindex-update
          ref: ${{ env.UPDATER_COMMIT }}
          path: .updater
          persist-credentials: false
      - name: Use the pinned updater source
        run: echo "PYTHONPATH=$PWD/.updater/src" >> "$GITHUB_ENV"
      - name: Test audit generation and admission rules
        run: |
          python -m pip install pytest pyyaml # host-dep-ok: the runner test harness
          python -m pytest -q tests/test_autoupdate_audit.py tests/test_autoupdate_workflow.py
      - name: Audit all package declarations
        run: python .github/scripts/autoupdate-ci.py audit --output coverage.json
      - name: Protect published versions
        if: inputs.validation_base != '' || (github.event_name == 'pull_request' && (github.event.pull_request.user.login == 'github-actions[bot]' || github.head_ref == 'feat/unified-autoupdate'))
        env:
          BASE: ${{ github.event.pull_request.base.sha || inputs.validation_base }}
        run: |
          resolved=$(git rev-parse --verify "$BASE^{commit}" 2>/dev/null || git rev-parse --verify "origin/$BASE^{commit}")
          python -m xpkgindex_update guard --base "$resolved" --output preservation.json
      - uses: actions/cache/restore@v4
        if: github.ref_name == github.event.repository.default_branch && !inputs.dry_run && inputs.package == '' && inputs.validation_base == ''
        with:
          path: .update-state.json
          key: unified-update-state-${{ github.run_id }}
          restore-keys: unified-update-state-
      - name: Load durable progress and candidate queue
        if: github.ref_name == github.event.repository.default_branch && !inputs.dry_run && inputs.package == '' && inputs.validation_base == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/autoupdate-state.py load
      - name: Check real upstream resources once
        id: check
        if: github.event_name != 'pull_request' && inputs.validation_base == ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ inputs.package }}
          MAX_BATCHES: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.max_batches) || '20' }}
        run: |
          args=()
          if [[ -n "$PACKAGE" ]]; then args+=(--package "$PACKAGE"); fi
          python -m xpkgindex_update check "${args[@]}" --max-batches "$MAX_BATCHES" --state-file .update-state.json --output plan.json
      - name: Validate plan and available checkpoint
        id: progress
        if: always() && steps.check.outcome != 'skipped'
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          if [[ -f .update-state.json ]]; then
            python -c 'from xpkgindex_update.state import load_state; from pathlib import Path; load_state(Path(".update-state.json"))'
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          elif [[ -z "$PACKAGE" ]]; then
            echo '::error::Full scan did not produce a progress checkpoint'
            exit 1
          fi
          python -c 'import json, subprocess; from pathlib import Path; p=json.loads(Path("plan.json").read_text()); assert p["base_commit"] == subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(); assert isinstance(p["candidates"], list)'
          echo 'plan_ready=true' >> "$GITHUB_OUTPUT"
      - name: Select added candidate versions from the PR diff
        id: matrix
        env:
          BASE: ${{ github.event.pull_request.base.sha || inputs.validation_base || github.sha }}
        run: |
          resolved=$(git rev-parse --verify "$BASE^{commit}" 2>/dev/null || git rev-parse --verify "origin/$BASE^{commit}")
          python .github/scripts/autoupdate-ci.py matrix --base "$resolved" --output matrix.json
          echo "value=$(python -c 'import json; print(json.dumps(json.load(open("matrix.json")),separators=(",",":")))')" >> "$GITHUB_OUTPUT"
      - name: Verify every added candidate resource without discovery
        if: steps.matrix.outputs.value != '{"include":[]}'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha || inputs.validation_base || github.sha }}
        run: |
          resolved=$(git rev-parse --verify "$BASE^{commit}" 2>/dev/null || git rev-parse --verify "origin/$BASE^{commit}")
          python -m xpkgindex_update verify --base "$resolved" --output candidate-resources.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-update-plan
          path: |
            plan.json
            coverage.json
            matrix.json
            preservation.json
            candidate-resources.json
            .update-state.json
            .update-state-store.json
          include-hidden-files: true
  propose:
    needs: scan
    if: >-
      always() && needs.scan.result == 'success' && needs.scan.outputs.plan_ready == 'true' && github.event_name != 'pull_request' && inputs.validation_base == '' &&
      github.ref_name == github.event.repository.default_branch && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: openxlings/xpkgindex-update
          ref: ${{ env.UPDATER_COMMIT }}
          path: .updater
          persist-credentials: false
      - run: echo "PYTHONPATH=$PWD/.updater/src" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: unified-update-plan
          path: .update-plan
      - name: Propose from the fixed plan
        id: proposal
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.ref_name }}
        run: |
          git switch -C "$BASE" "$GITHUB_SHA"
          if [[ -f .update-plan/.update-state.json ]]; then cp .update-plan/.update-state.json .update-state.json; fi
          if [[ -f .update-plan/.update-state-store.json ]]; then cp .update-plan/.update-state-store.json .update-state-store.json; fi
          python -m xpkgindex_update propose --plan .update-plan/plan.json --state-file .update-state.json --base "$BASE" --draft --output proposals.json
      - name: Dispatch successfully created or refreshed PR heads
        if: always() && steps.proposal.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.ref_name }}
        run: |
          if [[ -f proposals.json ]]; then
            python .github/scripts/autoupdate-dispatch.py --proposals proposals.json --base "$BASE"
          fi
      - name: Preserve proposal failures in the final gate
        if: always()
        env:
          PROPOSAL: ${{ steps.proposal.outcome }}
        run: '[[ "$PROPOSAL" == success ]]'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-update-proposals
          path: |
            proposals.json
            dispatches.json
            .update-state.json
            .update-state-store.json
          include-hidden-files: true
  persist:
    needs: [scan, propose]
    if: >-
      always() && needs.scan.outputs.state_ready == 'true' &&
      github.ref_name == github.event.repository.default_branch && !inputs.dry_run &&
      inputs.package == '' && inputs.validation_base == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: unified-update-plan
          path: .scan-progress
      - uses: actions/download-artifact@v4
        if: needs.propose.result != 'skipped'
        continue-on-error: true # A failed/cancelled proposal can fall back to the scan checkpoint.
        with:
          name: unified-update-proposals
          path: .proposal-progress
      - name: Save the newest checkpoint with compare-and-swap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          checkpoint=.scan-progress
          if [[ -f .proposal-progress/.update-state.json && -f .proposal-progress/.update-state-store.json ]]; then checkpoint=.proposal-progress; fi
          python .github/scripts/autoupdate-state.py save --state "$checkpoint/.update-state.json" --metadata "$checkpoint/.update-state-store.json"
  result:
    needs: [cadence, scan, propose, persist]
    if: always() && needs.cadence.outputs.due == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Reject incomplete verification
        env:
          SCAN: ${{ needs.scan.result }}
          CHECK: ${{ needs.scan.outputs.checked }}
          PROPOSE: ${{ needs.propose.result }}
          PERSIST: ${{ needs.persist.result }}
        run: |
          [[ "$SCAN" == success ]]
          [[ "$CHECK" != failure ]]
          [[ "$PROPOSE" != failure && "$PROPOSE" != cancelled ]]
          [[ "$PERSIST" != failure && "$PERSIST" != cancelled ]]
