name: llvm payload

# A toolchain payload reads the same inputs on every host (mcpp design
# 2026-11-19, section 11.2). On every host a changed llvm version is served on
# -- Linux x86_64 and aarch64, macOS arm64, Windows x86_64 -- the archive the
# recipe names compiles, with its own clang, one ELF object whose debug
# sections are zlib-compressed and one whose sections are zstd-compressed, and
# links each through that clang, which must run the ld.lld beside it; either
# link failing fails the job (.github/scripts/program-checks/llvm-compressed-links.py).
# The Windows archive of llvm 23.1.3 revision 3 shipped no ld.lld.exe: its
# driver ran the host's, built without zlib (mcpp-platforms run 44123489011).
#
# The archives are the ones the recipe names, by digest. One this index makes
# (a tools/res resource) is built here first, the same command `res-build`
# runs, so a revision is admitted on its host before it is published; its
# artifact is the one `res-build` publishes (`publish_runs`).
on:
  workflow_call:
    inputs:
      base_sha:
        type: string
        default: ""
      head_sha:
        type: string
        default: ""
  workflow_dispatch: null

permissions:
  contents: read
  actions: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      resources: ${{ steps.plan.outputs.resources }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lua, to read the recipe in the recipe sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lua5.4 # host-dep-ok: the recipe sandbox loads recipes as Lua, as check-revision does
      - id: plan
        env:
          BASE: ${{ inputs.base_sha || 'HEAD^' }}
          HEAD: ${{ inputs.head_sha || 'HEAD' }}
        run: python3 .github/scripts/llvm-payload-plan.py --base "$BASE" --head "$HEAD" --github-output "$GITHUB_OUTPUT"

  resources:
    name: build ${{ matrix.what }} ${{ matrix.version }}
    needs: plan
    if: needs.plan.outputs.resources != '{"include":[]}'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.resources) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: bash tools/res/build.sh "${{ matrix.what }}" "${{ matrix.version }}" out
      - uses: actions/upload-artifact@v4
        with:
          name: res-${{ matrix.what }}-${{ matrix.version }}-x86_64
          path: out/
          if-no-files-found: error

  links:
    name: ${{ matrix.version }} on ${{ matrix.platform }} ${{ matrix.arch }}
    needs: [plan, resources]
    if: >-
      always() && needs.plan.result == 'success'
      && needs.plan.outputs.matrix != '{"include":[]}'
      && (needs.resources.result == 'success' || needs.resources.result == 'skipped')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        if: matrix.artifact != ''
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/res
      - name: Link zlib- and zstd-compressed debug sections with the payload's own linker
        shell: bash
        env:
          URL: ${{ matrix.url }}
          SHA256: ${{ matrix.sha256 }}
          BUILT: ${{ matrix.artifact != '' && format('{0}/res/{1}', runner.temp, matrix.file) || '' }}
          WORK: ${{ runner.temp }}/llvm-payload
        run: |
          if [ -n "$BUILT" ]; then source=(--archive "$BUILT"); else source=(--url "$URL"); fi
          python .github/scripts/program-checks/llvm-compressed-links.py --sha256 "$SHA256" --work "$WORK" "${source[@]}"
