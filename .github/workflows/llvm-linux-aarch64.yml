name: LLVM Linux aarch64 closure

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.agents/tools/build-linux-aarch64-deps.sh'
      - '.agents/tools/build-llvm-subpkg.sh'
      - '.agents/tools/graphics/build-glibc.sh'
      - '.agents/tools/graphics/patches/glibc-*'
      - '.github/workflows/llvm-linux-aarch64.yml'

concurrency:
  group: llvm-aarch64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-assets:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install source-build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison gawk texinfo patchelf libgmp-dev libmpfr-dev libmpc-dev rsync autoconf automake libtool
      - name: Build the native dependency closure
        env:
          AARCH64_DEPS_OUT: /tmp/aarch64-assets
        run: bash .agents/tools/build-linux-aarch64-deps.sh
      - name: Build the managed glibc payload
        env:
          GLIBC_BUILD_CC: gcc
          GLIBC_BUILD_CXX: g++
          GLIBC_BUILD_ARCH: aarch64
          GLIBC_BUILD_HEADERS: /tmp/aarch64-deps/linux-headers-5.11.1-linux-aarch64/include
          XLINGS_GFX_WORK: /tmp/glibc-build
        run: |
          bash .agents/tools/graphics/build-glibc.sh 2.44 2.44.3 1
          cp /tmp/glibc-build/dist/*.tar.gz /tmp/aarch64-assets/
      - name: Verify and carve the upstream LLVM release
        run: |
          curl -fL --retry 3 -o /tmp/LLVM-23.1.3-Linux-ARM64.tar.xz https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.3/LLVM-23.1.3-Linux-ARM64.tar.xz
          echo '56d005e339c979a696ed6c244e6472e16f3b1371e48987a07e6145bda7ee0d03  /tmp/LLVM-23.1.3-Linux-ARM64.tar.xz' | sha256sum -c -
          mkdir -p /tmp/llvm-full
          tar -xf /tmp/LLVM-23.1.3-Linux-ARM64.tar.xz -C /tmp/llvm-full
          for kind in llvm tools; do
            bash .agents/tools/build-llvm-subpkg.sh --in /tmp/llvm-full --pkg "$kind" --version 23.1.3 --platform linux --arch aarch64 --out /tmp/aarch64-assets
          done
      - name: Record immutable archive digests
        run: |
          cd /tmp/aarch64-assets
          for archive in *.tar.gz *.tar.xz; do
            sha256sum "$archive" > "$archive.sha256"
          done
          sha256sum *.tar.gz *.tar.xz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llvm2313-linux-aarch64-assets
          path: /tmp/aarch64-assets
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: llvm2313-linux-aarch64-build-logs
          path: /tmp/glibc-build/*.log
          if-no-files-found: ignore
