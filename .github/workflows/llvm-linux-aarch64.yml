name: LLVM Linux aarch64 closure

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Optional successful native run to reuse; unchanged builder sources and fresh admission required'
        type: string
        required: false
        default: ''
      published_glibc_only:
        description: 'Reuse eight identical source archives and verify current published glibc r3 from both mirrors'
        type: boolean
        required: false
        default: false
      publish_global:
        description: 'Upload immutable GLOBAL resources after native build admission (index remains inactive)'
        type: boolean
        required: false
        default: false
  pull_request:
    paths:
      - '.agents/tools/build-linux-aarch64-deps.sh'
      - '.agents/tools/admit-linux-aarch64-assets.sh'
      - '.agents/tools/upload-linux-aarch64-assets.py'
      - '.agents/tools/reuse-linux-aarch64-assets.py'
      - '.agents/tools/verify-toolchain.sh'
      - '.agents/tools/build-llvm-subpkg.sh'
      - '.agents/tools/graphics/build-glibc.sh'
      - '.agents/tools/graphics/patches/glibc-*'
      - '.github/workflows/llvm-linux-aarch64.yml'

concurrency:
  group: llvm-aarch64-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  native-assets:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install source-build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison gawk texinfo patchelf libgmp-dev libmpfr-dev libmpc-dev rsync autoconf automake libtool lua5.4
      - name: Reuse an identical successful native source build
        if: github.event_name == 'pull_request' || inputs.source_run_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_GLIBC_ONLY: ${{ github.event_name == 'pull_request' || inputs.published_glibc_only }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id || '37689904325' }}
        run: |
          args=()
          if [[ "$PUBLISHED_GLIBC_ONLY" == true ]]; then args+=(--published-glibc-only); fi
          python3 .agents/tools/reuse-linux-aarch64-assets.py "$SOURCE_RUN_ID" /tmp/aarch64-assets "${args[@]}"
      - name: Build the native dependency closure
        if: github.event_name == 'workflow_dispatch' && inputs.source_run_id == ''
        env:
          AARCH64_DEPS_OUT: /tmp/aarch64-assets
        run: bash .agents/tools/build-linux-aarch64-deps.sh
      - name: Build the managed glibc payload
        if: github.event_name == 'workflow_dispatch' && inputs.source_run_id == ''
        env:
          GLIBC_BUILD_CC: gcc
          GLIBC_BUILD_CXX: g++
          GLIBC_BUILD_ARCH: aarch64
          GLIBC_BUILD_HEADERS: /tmp/aarch64-deps/linux-headers-5.11.1-linux-aarch64/include
          XLINGS_GFX_WORK: /tmp/glibc-build
        run: |
          bash .agents/tools/graphics/build-glibc.sh 2.44 2.44.3 3
          cp /tmp/glibc-build/dist/*.tar.gz /tmp/aarch64-assets/
      - name: Verify and carve the upstream LLVM release
        if: github.event_name == 'workflow_dispatch' && inputs.source_run_id == ''
        run: |
          rm -rf /tmp/aarch64-deps/gcc-build /tmp/aarch64-deps/gcc-15.1.0 /tmp/glibc-build/src /tmp/glibc-build/stage
          curl -fL --retry 3 -o /tmp/LLVM-23.1.3-Linux-ARM64.tar.xz https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.3/LLVM-23.1.3-Linux-ARM64.tar.xz
          echo '56d005e339c979a696ed6c244e6472e16f3b1371e48987a07e6145bda7ee0d03  /tmp/LLVM-23.1.3-Linux-ARM64.tar.xz' | sha256sum -c -
          mkdir -p /tmp/llvm-full
          tar -xf /tmp/LLVM-23.1.3-Linux-ARM64.tar.xz -C /tmp/llvm-full
          for kind in llvm tools; do
            bash .agents/tools/build-llvm-subpkg.sh --in /tmp/llvm-full --pkg "$kind" --version 23.1.3 --platform linux --arch aarch64 --out /tmp/aarch64-assets
          done
      - name: Record immutable archive digests
        if: github.event_name == 'workflow_dispatch' && inputs.source_run_id == ''
        run: |
          rm -rf /tmp/llvm-full /tmp/LLVM-23.1.3-Linux-ARM64.tar.xz
          cd /tmp/aarch64-assets
          for archive in *.tar.gz *.tar.xz; do
            sha256sum "$archive" > "$archive.sha256"
          done
          sha256sum *.tar.gz *.tar.xz > SHA256SUMS
      - name: Admit managed native processes, runtime data, headers and modules
        run: bash .agents/tools/admit-linux-aarch64-assets.sh /tmp/aarch64-assets
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llvm2313-linux-aarch64-assets
          path: /tmp/aarch64-assets
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: llvm2313-linux-aarch64-build-logs
          path: /tmp/glibc-build/*.log
          if-no-files-found: ignore

  upload-global:
    needs: native-assets
    if: github.event_name == 'workflow_dispatch' && inputs.publish_global
    runs-on: ubuntu-24.04-arm
    environment: xlings-res-publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: llvm2313-linux-aarch64-assets
          path: /tmp/aarch64-assets
      - name: Upload and verify immutable build-admitted GLOBAL resources
        env:
          GH_TOKEN: ${{ secrets.XLINGS_RES_TOKEN }}
        run: python3 .agents/tools/upload-linux-aarch64-assets.py /tmp/aarch64-assets --execute
