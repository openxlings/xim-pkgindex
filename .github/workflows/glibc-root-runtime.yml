name: glibc root runtime

on:
  pull_request:
    paths:
      - '.agents/tools/graphics/build-glibc.sh'
      - '.agents/tools/graphics/check-glibc-root-cache.sh'
      - '.agents/tools/graphics/patches/glibc-*.patch'
      - '.github/workflows/glibc-root-runtime.yml'
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Publication only: reviewed successful two-architecture r3 source run (no rebuild)'
        type: string
        required: false
        default: ''
      publish_global:
        description: 'Publish only immutable GLOBAL glibc r3 assets; package index stays inactive'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.source_run_id == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prepare native build tools
        run: |
          set -euo pipefail
          sudo timeout --signal=TERM --kill-after=15s 240s apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 update
          sudo timeout --signal=TERM --kill-after=15s 420s apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 install -y build-essential bison gawk patchelf lua5.4
      - name: Build and verify the logical-root cache boundary
        env:
          XLINGS_GFX_ARCH: ${{ matrix.arch }}
          XLINGS_GFX_SUBOS: native-glibc
          GLIBC_BUILD_CC: /usr/bin/gcc
          GLIBC_BUILD_CXX: /usr/bin/g++
          XLINGS_GFX_JOBS: '8'
        run: |
          export XLINGS_HOME="$RUNNER_TEMP/glibc-home"
          export XLINGS_GFX_WORK="$RUNNER_TEMP/glibc-work"
          mkdir -p "$RUNNER_TEMP/glibc-uapi"
          lua5.4 - pkgs/l/linux-headers.lua "$XLINGS_GFX_ARCH" > "$RUNNER_TEMP/glibc-uapi/resource" <<'LUA'
          function import() end
          assert(loadfile(arg[1]))()
          local r = package.xpm.linux["5.11.1"][arg[2]]
          print(r.url.GLOBAL)
          print(r.sha256)
          LUA
          mapfile -t resource < "$RUNNER_TEMP/glibc-uapi/resource"
          curl -fL --retry 3 -o "$RUNNER_TEMP/glibc-uapi/headers.tar.gz" "${resource[0]}"
          printf '%s  %s\n' "${resource[1]}" "$RUNNER_TEMP/glibc-uapi/headers.tar.gz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/glibc-uapi/headers.tar.gz" -C "$RUNNER_TEMP/glibc-uapi"
          mapfile -t headers < <(find "$RUNNER_TEMP/glibc-uapi" -type f -path '*/include/linux/limits.h')
          [[ ${#headers[@]} == 1 ]]
          export GLIBC_BUILD_HEADERS="${headers[0]%/linux/limits.h}"
          bash .agents/tools/graphics/build-glibc.sh 2.44 2.44.3 3
          python3 .agents/tools/check-glibc-data-inventory.py "$XLINGS_GFX_WORK/dist/glibc-2.44.3-r3-linux-$XLINGS_GFX_ARCH.tar.gz" --arch "$XLINGS_GFX_ARCH" --revision 3
          cd "$XLINGS_GFX_WORK/dist"
          sha256sum *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glibc-2.44.3-r3-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/glibc-work/dist/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: glibc-build-logs-${{ matrix.arch }}
          path: ${{ runner.temp }}/glibc-work/*log
          if-no-files-found: ignore

  publish-global-r3:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_global && inputs.source_run_id != ''
    runs-on: ubuntu-24.04-arm
    environment: xlings-res-publish
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate the reviewed successful native source and ledger
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: python3 .agents/tools/publish-glibc-r3-assets.py "$SOURCE_RUN_ID" /tmp/glibc-r3-assets
      - uses: actions/download-artifact@v4
        with:
          name: glibc-2.44.3-r3-linux-aarch64
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/glibc-r3-assets/aarch64
      - uses: actions/download-artifact@v4
        with:
          name: glibc-2.44.3-r3-linux-x86_64
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/glibc-r3-assets/x86_64
      - name: Verify and publish immutable GLOBAL glibc r3 only
        env:
          GH_TOKEN: ${{ secrets.XLINGS_RES_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: python3 .agents/tools/publish-glibc-r3-assets.py "$SOURCE_RUN_ID" /tmp/glibc-r3-assets --publish
