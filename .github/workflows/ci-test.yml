name: Package lifecycle
on:
  workflow_call:
    inputs:
      matrix:
        type: string
        required: true
jobs:
  install:
    name: install (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-xlings
      - name: ELF and Lua tooling
        if: runner.os == 'Linux'
        timeout-minutes: 12
        shell: bash
        run: |
          sudo timeout --signal=TERM --kill-after=15s 240s apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 update -qq
          sudo timeout --signal=TERM --kill-after=15s 420s env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 install -y --no-install-recommends binutils patchelf lua5.4
      - name: Install and remove planned packages (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        env:
          FILES: ${{ matrix.files }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          chmod +x .github/scripts/posix-test.sh .github/scripts/dep-closure-check.sh
          .github/scripts/posix-test.sh "$FILES" "$GITHUB_WORKSPACE" "$PLATFORM"
      - name: Install and remove planned packages (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          FILES: ${{ matrix.files }}
        run: |
          & .github/scripts/windows-test.ps1 -ChangedFiles $env:FILES -WorkspaceRoot $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
