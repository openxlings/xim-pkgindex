# .github/workflows/pkgindex-deploy.yml

name: Deploy PkgIndex Site

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages-main
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.scope.outputs.changed }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The growth curve, the history line and the contributor list are
          # replayed from the git log. xpkgindex detects a shallow clone and
          # skips all three rather than replaying a truncated one, so the
          # default depth of 1 was quietly shipping a site without them.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Publication scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: python3 .github/scripts/ci-publication-scope.py --target site --event "$EVENT" --github-output "$GITHUB_OUTPUT"

      - name: Require successful main CI for this exact source
        if: steps.scope.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/ci-verified-source.py --repository "$REPOSITORY"

      - name: Set up Python
        if: steps.scope.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install xpkgindex
        if: steps.scope.outputs.changed == 'true'
        run: pip install -r .xpkgindex/requirements.txt

      - name: Generate static site
        if: steps.scope.outputs.changed == 'true'
        # Hand build provenance to xpkgindex via the env-var contract added
        # in openxlings/xpkgindex (Apr 2026). When at least one is set the
        # generator emits a "Build Info" section on the About page.
        env:
          # Raises the API rate limit and enables the author -> login mapping
          # that merges one person's several git identities.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XPKGINDEX_BUILD_TIME:       ${{ github.event.head_commit.timestamp }}
          XPKGINDEX_BUILD_COMMIT:     ${{ github.event.workflow_run.head_sha || github.sha }}
          XPKGINDEX_BUILD_COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          # workflow_dispatch leaves head_commit.timestamp empty; fall back
          # to "now" so the About page always shows a meaningful build time.
          if [ -z "$XPKGINDEX_BUILD_TIME" ]; then
            XPKGINDEX_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            export XPKGINDEX_BUILD_TIME
          fi
          xpkgindex generate . --output site

      - name: Upload artifact
        if: steps.scope.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.changed == 'true'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
