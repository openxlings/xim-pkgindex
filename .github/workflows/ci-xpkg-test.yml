name: xpkg test

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths:
      - 'pkgs/**'
      - 'tests/**'
  pull_request:
    paths:
      - 'pkgs/**'
      - 'tests/**'

jobs:

  # L0 + L2: 静态分析 + 隔离合规 (无需 xlings, 秒级完成)
  static-and-isolation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: pip install pytest

      - name: L0 Static Analysis
        run: pytest tests/ -m static --tb=short -q

      - name: L2 Isolation Compliance
        run: pytest tests/ -m isolation --tb=short -q

  # L1: 索引注册 (需要 xlings)
  index-registration:
    runs-on: ubuntu-latest
    needs: static-and-isolation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: pip install pytest

      - name: Install xlings
        run: |
          export XLINGS_NON_INTERACTIVE=1
          export XLINGS_VERSION=v2026.8.8.2
          curl -fsSL https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh | bash
          echo "XLINGS_HOME=$HOME/.xlings" >> "$GITHUB_ENV"
          echo "PATH=$HOME/.xlings/subos/current/bin:$HOME/.xlings/bin:$PATH" >> "$GITHUB_ENV"


      # Refresh the index. The release tarball bundles a pkgindex snapshot
      # frozen at build time, so without this a package's DEPENDENCIES resolve
      # against a months-old index even though the package under test comes
      # from this checkout. That is how `local:rust` failed with
      # `sh: 1: rustup-init: not found`: its rustup dep came from the frozen
      # snapshot, where rustup's config hook still aborted, so the shim was
      # never registered. Nothing about rust was wrong.
      - name: Refresh package index
        run: xlings update
      - name: L1 Index Registration
        run: pytest tests/ -m index --tb=short -q

  # L3 + L4: 生命周期 + 功能验证 —— 首次进 CI (2026-08-09)。
  #
  # 此前这条流水线止步于 L1: L3/L4 会真装包, 全量跑意味着每次 push 下载
  # 若干 GB, 所以一直只挑一个闭环关键包。载体是 ncurses —— 规则 D 已知缺口
  # (libtinfo.so.6/libncurses.so.6) 的提供者, mcpp#392 的根修 —— 其 verify
  # 层断言的是「装出来的东西」: 载荷落盘、xvm workspace 落盘注册 (读 subos
  # 的 .xlings.json, 不依赖独立的 xvm CLI)、RUNPATH 不出 home、以及我们的
  # ld.so 能解析 libtinfo (形态 X 需要而 mcpp#392 缺失的那次解析)。
  # (jdk-zulu 的 D5-1 闭环于 2026-08-09 按用户决定暂缓 —— JDK 先用上游默认
  # 形态; 测量与机制记录在 ecosystem-closure 设计文档 §8。)
  #
  # 门禁口径: 测的是本 PR 的内容, 不是已发布索引。做法照抄 posix-test.sh
  # 的两条既有路径, 不发明第二种:
  #   * 已发布包 (deps 解析会用到 glibc/fontconfig 等) 走 overlay —— update
  #     拉到发布索引后把 checkout 原位覆盖进去, 同名同 xim: namespace,
  #     恰好是合并后才存在的状态; libs/ 一并覆盖, 否则 recipe import 的
  #     xim.pkgindex.* 落到吞调用的 stub 上, seal 静默 no-op。
  #   * 新包 (ncurses 本体) 走 --add-xpkg 的 local: 路径 —— overlay 服务
  #     不了新名字: 编译好的 catalog 里没有 xim:ncurses 这个条目, 按名解析
  #     miss 会触发单次自动 refresh (commands.cppm C2/#366) 重拉发布
  #     artifact, 把 overlay 一并盖回去。这也是「overlay 之后每次解析必须
  #     一击即中」的由来, 以及 lifecycle 测试用显式 local:ncurses 的原因
  #     (裸名在 scode:ncurses 并存时歧义)。
  # 合并到 main 后 checkout 与待发布内容一致, main 上的同一 job / 索引
  # 发布后的 re-run 即是「守发布物」—— 那份职责不在 PR 门禁上, 否则任何
  # 给已发布包加版本键的 PR 都结构性首红。
  closure-lifecycle:
    runs-on: ubuntu-latest
    needs: index-registration
    # ncurses 载荷 <1MB + glibc 依赖, 预算从容
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: pip install pytest

      - name: Install xlings
        run: |
          export XLINGS_NON_INTERACTIVE=1
          export XLINGS_VERSION=v2026.8.8.2
          curl -fsSL https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh | bash
          echo "XLINGS_HOME=$HOME/.xlings" >> "$GITHUB_ENV"
          echo "PATH=$HOME/.xlings/subos/current/bin:$HOME/.xlings/bin:$PATH" >> "$GITHUB_ENV"

      # 先 update 再 overlay, 且之后不得再 update —— update 会重拉发布
      # artifact 把覆盖进去的文件盖回去。overlay 让 ncurses 的 deps 按本
      # checkout 解析: xim:glibc 的 latest 在这里是 2.44 (glibc.lua 的
      # 永久地板策略), 不是发布索引里的旧值。
      - name: Refresh package index
        run: xlings update

      - name: Overlay this checkout onto the index (posix-test.sh mechanism)
        run: |
          IDX="$HOME/.xlings/data/xim-pkgindex"
          test -d "$IDX" && test ! -L "$IDX"
          cp -rf pkgs/. "$IDX/pkgs/"
          mkdir -p "$IDX/libs"
          cp -f libs/*.lua "$IDX/libs/"
          echo "index now serves this checkout's recipes + libs ($IDX)"

      # 新包按 posix-test.sh 的新包惯例注册进 local:, 并把 libs/ 也放进
      # local 索引 —— 没有它, local: recipe 里 import("xim.pkgindex.*")
      # 解析到吞调用的代理, selfcontain.seal 静默 no-op。
      - name: "Register ncurses under local: (new package path)"
        run: |
          xlings config --add-xpkg pkgs/n/ncurses.lua
          LOCAL_IDX="$HOME/.xlings/data/xim-pkgindex-local"
          mkdir -p "$LOCAL_IDX/libs"
          cp -f libs/*.lua "$LOCAL_IDX/libs/"

      # lifecycle 先装包, verify 再对装出来的东西做断言; -x 让装包失败时
      # 立即停 —— 后面的 verify 全是同一个因的噪音
      - name: L3 + L4 closure lifecycle (ncurses)
        run: pytest tests/n/test_ncurses.py -m "lifecycle or verify" --tb=short -q -x
